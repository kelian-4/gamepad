name: iOS Build (unsigned IPA)

on:
  push:
    branches: [dev, main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare debug log
        run: |
          mkdir -p debug
          {
            echo "# CI Status"
            echo ""
            echo "- Run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "- Commit: ${{ github.sha }}"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
          } > debug/ci-status.md

      - name: Select Xcode
        run: |
          set +e
          { sudo xcode-select -s /Applications/Xcode.app ; } > debug/01-select-xcode.log 2>&1
          code=$?
          echo "## Select Xcode (exit $code)" >> debug/ci-status.md
          echo '```' >> debug/ci-status.md
          tail -n 50 debug/01-select-xcode.log >> debug/ci-status.md
          echo '```' >> debug/ci-status.md
          xcodebuild -version >> debug/ci-status.md 2>&1 || true
          exit $code

      - name: Install XcodeGen
        run: |
          set +e
          { brew install xcodegen ; } > debug/02-install-xcodegen.log 2>&1
          code=$?
          echo "## Install XcodeGen (exit $code)" >> debug/ci-status.md
          echo '```' >> debug/ci-status.md
          tail -n 60 debug/02-install-xcodegen.log >> debug/ci-status.md
          echo '```' >> debug/ci-status.md
          exit $code

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set +e
          { xcodegen generate ; } > ../debug/03-xcodegen-generate.log 2>&1
          code=$?
          echo "## Generate Xcode project (exit $code)" >> ../debug/ci-status.md
          echo '```' >> ../debug/ci-status.md
          tail -n 80 ../debug/03-xcodegen-generate.log >> ../debug/ci-status.md
          echo '```' >> ../debug/ci-status.md
          exit $code

      - name: Build unsigned archive
        working-directory: ios
        run: |
          set +e
          {
            xcodebuild \
              -project Gamepad.xcodeproj \
              -scheme Gamepad \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/Gamepad.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              clean archive
          } > ../debug/04-xcodebuild-archive.log 2>&1
          code=$?
          echo "## Build unsigned archive (exit $code)" >> ../debug/ci-status.md
          echo '```' >> ../debug/ci-status.md
          tail -n 150 ../debug/04-xcodebuild-archive.log >> ../debug/ci-status.md
          echo '```' >> ../debug/ci-status.md
          exit $code

      - name: Package IPA
        working-directory: ios
        run: |
          set +e
          {
            mkdir -p build/Payload
            cp -R build/Gamepad.xcarchive/Products/Applications/Gamepad.app build/Payload/
            cd build
            zip -r Gamepad-unsigned.ipa Payload
            cd ..
          } > ../debug/05-package-ipa.log 2>&1
          code=$?
          echo "## Package IPA (exit $code)" >> ../debug/ci-status.md
          echo '```' >> ../debug/ci-status.md
          tail -n 60 ../debug/05-package-ipa.log >> ../debug/ci-status.md
          echo '```' >> ../debug/ci-status.md
          exit $code

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gamepad-unsigned-ipa
          path: ios/build/Gamepad-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Finalize debug log
        if: always()
        run: |
          echo "" >> debug/ci-status.md
          echo "- Résultat global du job: ${{ job.status }}" >> debug/ci-status.md

      - name: Commit debug log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug/
          if ! git diff --cached --quiet; then
            git commit -m "ci: debug logs for run ${{ github.run_id }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
