name: Gamepad
options:
  bundleIdPrefix: com.kelian.gamepad
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Gamepad:
    type: application
    platform: iOS
    sources:
      - path: Gamepad/Sources
      - path: Gamepad/Resources/Assets.xcassets
    info:
      path: Gamepad/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "L'app a besoin d'accéder au réseau local pour se connecter au serveur de la manette virtuelle."
        NSBonjourServices:
          - _gamepad._tcp
        NSCameraUsageDescription: "La caméra sert à scanner le QR code affiché par le serveur pour s'y connecter."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kelian.gamepad
        PRODUCT_NAME: Gamepad
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
